name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest provides the supported system Python. Avoid a runtime
      # download so a transient tool-cache outage cannot block source checks.
      - name: Check Python version
        run: python3 --version
      - name: Validate release tree
        run: python3 release_check.py
      - name: Compile Python sources
        run: python3 -m compileall -q .
      - name: Run unit and contract tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check whitespace
        run: git diff --check
